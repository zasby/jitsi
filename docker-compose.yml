version: '3.8'

services:
  # Основной сервис MiroTalk
  mirotalk:
    image: node:18-alpine
    container_name: mirotalk
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./mirotalk:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DOMAIN=connect.mooz.pro
      - PORT=3000
    command: sh -c "npm install && npm start"
    networks:
      - mirotalk-network

  # Nginx для проксирования и SSL
  nginx:
    image: nginx:alpine
    container_name: mirotalk-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - mirotalk
    networks:
      - mirotalk-network

  # Certbot для SSL сертификатов
  certbot:
    image: certbot/certbot
    container_name: mirotalk-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email admin@mooz.pro --agree-tos --no-eff-email -d connect.mooz.pro
    networks:
      - mirotalk-network

networks:
  mirotalk-network:
    driver: bridge

volumes:
  mirotalk-data: