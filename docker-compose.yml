services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CERT_DIR}/fullchain.pem:/etc/ssl/certs/${DOMAIN}.crt:ro
      - ${CERT_DIR}/privkey.pem:/etc/ssl/private/${DOMAIN}.key:ro
    depends_on:
      - prosody
      - web

  web:
    image: jitsi/web:stable
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      # Подменяем конфиг во всех популярных местах, которые может читать образ
      - ./jitsi-meet/config.js:/usr/share/jitsi-meet/config.js:ro
      - ./jitsi-meet/config.js:/defaults/config.js:ro
      - ./jitsi-meet/config.js:/etc/jitsi/meet/${DOMAIN}-config.js:ro
      - ./overrides/lib-jitsi-meet.min.js:/usr/share/jitsi-meet/libs/lib-jitsi-meet.min.js:ro
    depends_on:
      - prosody

  prosody:
    build:
      context: .
      dockerfile: Dockerfile.prosody
    restart: unless-stopped
    volumes:
      - ./prosody/prosody.cfg.lua:/etc/prosody/prosody.cfg.lua:ro
      - prosody-data:/var/lib/prosody
    expose:
      - "5280"

  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    network_mode: "host"
    environment:
      - REALM=${DOMAIN}
      - EXTERNAL_IP=${PUBLIC_IP}
    volumes:
      - ./turn/turnserver.conf:/etc/turnserver.conf:ro
      - ${CERT_DIR}/fullchain.pem:/etc/turn/certs/fullchain.pem:ro
      - ${CERT_DIR}/privkey.pem:/etc/turn/certs/privkey.pem:ro

volumes:
  prosody-data:


